BASE_TASK_CONFIG_PATH: habitat_extensions/config/multi_objectnav_v2.yaml
TASK_TYPE: OBJNAV
SIMULATOR_GPU_IDS: [0]
TORCH_GPU_ID: 0
TORCH_GPU_IDS: [0]
GPU_NUMBERS: 1
NUM_ENVIRONMENTS: 1
TENSORBOARD_DIR: data/tensorboard_dirs/
CHECKPOINT_FOLDER: data/checkpoints/
EVAL_CKPT_PATH_DIR: data/checkpoints/
RESULTS_DIR: data/logs/eval_results/
VIDEO_DIR: data/logs/video/
KEYBOARD_CONTROL: 0

SENSORS: ['RGB_SENSOR', 'DEPTH_SENSOR']

# Multi-agent specific knobs (consumed by P2+ code; declared here so YAML
# remains stable across the migration).
MULTI_AGENT:
  NUM_AGENTS: 2
  MIN_SPAWN_DISTANCE: 3.0   # meters between agent start positions (navmesh)
  MAX_SPAWN_TRIES: 50

MAP:
  VISUALIZE: True
  PRINT_IMAGES: False
  REPVITSAM: 1

EVAL:
  USE_CKPT_CONFIG: False
  SAVE_RESULTS: True
  SPLIT: val
  MIN_CONSTRAINT_STEPS: 10
  MAX_CONSTRAINT_STEPS: 25
  SCORE_THRESHOLD: 0.5
  VALUE_THRESHOLD: 0.30
  DECISION_THRESHOLD: 0.4
  FMM_WAYPOINT_THRESHOLD: 2.0
  FMM_GOAL_THRESHOLD: 1.0
  CHANGE_THRESHOLD: -0.03
  USE_CONTINUOUS_HISTORY: True
  HISTORY_INTERVAL: 2

DETECTION_CONFIDENCE_THRESHOLD: 0.0

SAVE_RGB: False
RGB_SAVE_DIR: "./saved_rgb_images"
