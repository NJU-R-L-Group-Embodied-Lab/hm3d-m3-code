mpc:
  # du_threshold: 0.1
  du_threshold: 0.002
  dt: 0.02
  #dt: 0.02
  # max_iter: 3
  max_iter: 150
  # predict_steps: 100
  predict_steps: 100
  delay_num: 0
  max_omega: 0.8
  max_domega: 2.0
  max_speed: 0.4
  max_accel: 1.0
  in_test: false
  control_a: false
  # Set true to let the MPC drive backward when reference yaw error > pi/2
  # (legacy behavior). false means always face the reference heading - this
  # avoids spurious U-turns on Ackermann/forward-only chassis.
  allow_reverse: false
  matrix_q: [5.0, 5.0, 2.5, 2.0]
  matrix_r: [2, 2]
  matrix_rd: [0.5, 0.3]
  # matrix_rd: [0.50, 0.30]
  test_traj: ""
